name: Build & Publish Fat Mod

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
      - '*-patched'
      - '*-patched-dev'
    tags: ['*']
  pull_request:
    branches: [main, master, develop, dev]
  workflow_dispatch:
    inputs:
      entcore_version:
        description: 'Version entcore (ex: 6.14.9-patched). Laissez vide pour utiliser la version du pom.xml.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  frontend:
    name: Build Frontend (Gulp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Node 10 via Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --user root \
            opendigitaleducation/node:10-alpine \
            sh -c "npm install --legacy-peer-deps && node_modules/gulp/bin/gulp.js build"
      # [B] IHM React (vue *-react.html -> /<module>/public/index.js) : sous-projet Vite
      # frontend/ (Node 20), paquets prives @open-ent -> auth OPENENT_PACKAGES_TOKEN. La copie
      # dans resources/public est embarquee par l'upload frontend-assets ci-dessous (fat-mod complet).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Build frontend React (sous-projet Vite frontend/)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
        run: |
          cd frontend
          pnpm install --no-frozen-lockfile
          pnpm build
          mkdir -p ../src/main/resources/public
          cp -r dist/public/. ../src/main/resources/public/

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: src/main/resources/
          retention-days: 1

  backend:
    name: Build & Publish Fat Mod
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: src/main/resources/
      - name: Build fat JAR
        run: |
          ENTCORE_OPT=""
          if [ -n "$ENTCORE_VERSION" ]; then ENTCORE_OPT="-DentCoreVersion=$ENTCORE_VERSION"; fi
          # Branche et commit écrits dans le MANIFEST (SCM-Branch / SCM-Commit-Id), lus par la
          # page « Modules & versions » du dashboard. La détection par git échoue dès que le HEAD
          # est détaché (déclenchement manuel, tag) et laisse SCM-Branch: UNKNOWN ; les variables
          # GitHub sont fiables dans tous les cas. Préventif ici : le jar 2.1.3-patched publié le
          # 2026-07-24 a bien sa branche, mais uniquement parce qu'il venait d'un push de branche.
          mvn clean package -DskipTests -B $ENTCORE_OPT \
            -DbuildNumber="${GITHUB_SHA::8}" -DscmBranch="${GITHUB_REF_NAME}"
        env:
          ENTCORE_VERSION: ${{ github.event.inputs.entcore_version }}
      - name: Run tests
        if: github.event_name == 'pull_request'
        run: mvn test -B
      - name: Configure Maven for GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Publish fat JAR to GitHub Packages
        # GitHub Packages refuse d'écraser une version existante (409 Conflict) : sur re-tag d'une
        # même version -patched, le fat mod est déjà publié -> on tolère l'échec (le job reste vert).
        # Pour republier un contenu FRAIS d'une version inchangée : supprimer d'abord la version
        # (API delete:packages, hors GITHUB_TOKEN Actions) puis rejouer. CCTP 51C — CI publish.
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GROUP_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          FAT_JAR=$(ls target/*-fat.jar 2>/dev/null | head -1)
          if [ -z "${FAT_JAR}" ]; then echo "::error::Fat JAR not found"; exit 1; fi
          mvn deploy:deploy-file \
            -Dfile="${FAT_JAR}" \
            -DgroupId="${GROUP_ID}" \
            -DartifactId="${ARTIFACT_ID}" \
            -Dversion="${VERSION}" \
            -Dclassifier=fat \
            -Dpackaging=jar \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${{ github.repository }}" \
            -B

      # Publish rct-nexus : forum est un module DUAL (React en CI depuis [B]) déployé en prod via
      # le launcher (openent-monolithe) qui tire les mods depuis nexus. Sans ce step, forum-*-patched
      # n'existe pas sur nexus -> FORUM_VERSION prod ne peut pas passer en -patched. Aligné sur les
      # autres modules duaux (delete-then-deploy pour republier la même version -patched).
      - name: Configure Maven for rct-nexus
        if: startsWith(github.ref, 'refs/tags/') || endsWith(github.ref, '-patched') || endsWith(github.ref, '-patched-dev')
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>pt-releases</id>
                <username>${env.NEXUS_USER}</username>
                <password>${env.NEXUS_PASSWORD}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Publish fat JAR to rct-nexus
        if: startsWith(github.ref, 'refs/tags/') || endsWith(github.ref, '-patched') || endsWith(github.ref, '-patched-dev')
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          GROUP_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          FAT_JAR=$(ls target/*-fat.jar 2>/dev/null | head -1)
          if [ -z "${FAT_JAR}" ]; then echo "::error::Fat JAR not found"; exit 1; fi
          NEXUS="https://rct-nexus.tech.fr"
          IDS=$(curl -sf -u "${NEXUS_USER}:${NEXUS_PASSWORD}" \
            "${NEXUS}/service/rest/v1/search?repository=maven-releases&maven.groupId=${GROUP_ID}&maven.artifactId=${ARTIFACT_ID}&version=${VERSION}" \
            | jq -r '.items[].id' || true)
          for id in ${IDS}; do
            curl -sf -u "${NEXUS_USER}:${NEXUS_PASSWORD}" -X DELETE "${NEXUS}/service/rest/v1/components/${id}" || true
          done
          mvn deploy:deploy-file \
            -Dfile="${FAT_JAR}" \
            -DgroupId="${GROUP_ID}" \
            -DartifactId="${ARTIFACT_ID}" \
            -Dversion="${VERSION}" \
            -Dclassifier=fat \
            -Dpackaging=jar \
            -DrepositoryId=pt-releases \
            -Durl="${NEXUS}/repository/maven-releases/" \
            -B

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/*-fat.jar
          generate_release_notes: true
